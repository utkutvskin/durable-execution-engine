services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dee}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dee}
      POSTGRES_DB: ${POSTGRES_DB:-dee}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - dee-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dee} -d ${POSTGRES_DB:-dee}"]
      interval: 2s
      timeout: 2s
      retries: 15

  jaeger:
    image: jaegertracing/all-in-one:1.76.0
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "${JAEGER_UI_PORT:-16686}:16686"
      - "${JAEGER_OTLP_HTTP_PORT:-4318}:4318"

  migrate:
    profiles: ["engine"]
    build: .
    image: dee-engine:local
    command: ["migrate", "up"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-dee}:${POSTGRES_PASSWORD:-dee}@postgres:5432/${POSTGRES_DB:-dee}

  api:
    profiles: ["engine"]
    build: .
    image: dee-engine:local
    command: ["serve"]
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-dee}:${POSTGRES_PASSWORD:-dee}@postgres:5432/${POSTGRES_DB:-dee}
      WF_API_KEY: ${WF_API_KEY:-}
      WF_OTLP_ENDPOINT: ${WF_OTLP_ENDPOINT:-}
    ports:
      - "${ENGINE_PORT:-8080}:8080"

  worker:
    profiles: ["engine"]
    build: .
    image: dee-engine:local
    command:
      - worker
      - --example
      - payment-saga
      - --example
      - etl-pipeline
      - --health-port
      - "9100"
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-dee}:${POSTGRES_PASSWORD:-dee}@postgres:5432/${POSTGRES_DB:-dee}
      WF_OTLP_ENDPOINT: ${WF_OTLP_ENDPOINT:-}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:9100/ready').then((r)=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 20s

volumes:
  dee-postgres-data:
