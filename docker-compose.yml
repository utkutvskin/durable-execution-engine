services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dee}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dee}
      POSTGRES_DB: ${POSTGRES_DB:-dee}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - dee-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dee} -d ${POSTGRES_DB:-dee}"]
      interval: 2s
      timeout: 2s
      retries: 15

volumes:
  dee-postgres-data:
