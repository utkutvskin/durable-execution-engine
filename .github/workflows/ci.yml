name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dee
          POSTGRES_PASSWORD: dee
          POSTGRES_DB: dee
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dee -d dee"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    env:
      DATABASE_URL: postgres://dee:dee@localhost:5432/dee
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: install a browser for the explorer e2e test
        run: |
          npx playwright-core install --with-deps chromium
          echo "PLAYWRIGHT_CHROMIUM_PATH=$(node -e "console.log(require('playwright-core').chromium.executablePath())")" >> "$GITHUB_ENV"

      - run: pnpm run verify

  examples:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dee
          POSTGRES_PASSWORD: dee
          POSTGRES_DB: dee
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dee -d dee"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    env:
      DATABASE_URL: postgres://dee:dee@localhost:5432/dee
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run test:examples

      - run: pnpm run example:payment

      - run: pnpm run example:etl

  docker:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dee
          POSTGRES_PASSWORD: dee
          POSTGRES_DB: dee
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dee -d dee"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    steps:
      - uses: actions/checkout@v7

      - run: docker build -t dee:ci .

      - name: start the image and run a workflow through it
        run: |
          docker run -d --name engine --network host \
            -e DATABASE_URL=postgres://dee:dee@localhost:5432/dee dee:ci
          ready=false
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/ready >/dev/null 2>&1; then ready=true; break; fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            echo "::error::the image did not become ready within 60 seconds"
            echo "--- /ready response"
            curl -sS -i http://127.0.0.1:8080/ready || true
            echo "--- docker logs"
            docker logs engine 2>&1 || true
            exit 1
          fi
          key=$(docker logs engine 2>&1 | sed -n 's/^namespace default, api key //p')
          docker exec -e WF_API_URL=http://127.0.0.1:8080 -e WF_API_KEY="$key" engine \
            node packages/cli/bin/wf.js run start payment-saga \
            --input '{"orderId":"o-1","customerId":"c-1","amountCents":4999}' --wait
          docker logs engine

      - name: show the image logs after a failure
        if: failure()
        run: |
          curl -sS -i http://127.0.0.1:8080/ready || true
          docker logs engine 2>&1 || true
